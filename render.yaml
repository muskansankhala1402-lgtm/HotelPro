services:
  # Backend Node.js / Express API
  - type: web
    name: hotelpro-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: hotelpro_super_secure_jwt_secret_key_2026_roomly_suite
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        fromService:
          name: hotelpro-frontend
          type: web
          property: host
      - key: MONGO_URI
        sync: false

  # Frontend React + Vite (static site)
  - type: web
    name: hotelpro-frontend
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hotelpro-backend
          type: web
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
